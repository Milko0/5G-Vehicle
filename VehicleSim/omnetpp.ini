#####################################################################
#  Project 3 - 5G connected vehicle            (OMNeT++ 6.x)
#
#  Factors:  V  = vehicle speed            {10, 20, 30, 40} m/s
#            H  = handover period          0.01 s ... 20 s (log-spaced)
#            T  = mean app interval        {10, 15, 20} ms
#            distribution of T             exponential / lognormal (same mean)
#####################################################################

[General]
network = Highway5G
sim-time-limit = 2200s
warmup-period  = 200s          # samples before 200 s are discarded
                               # -> 2000 s measured = 5/10/15/20 full round trips (2L/V) for V = 10/20/30/40
repeat = 10                    # 10 independent replications per scenario
seed-set = ${repetition}       # i-th replication of every scenario uses the same seeds

# ---- fixed system parameters (calibration) ----
*.numBs = 5                    # N
*.highwayLength = 2000m        # L   -> ISD = 500 m
*.roadOffset = 20m             # BSs are 20 m away from the road
*.backhaulDelay = 1ms
*.vehicle.alpha = 1.28e-7      # S = alpha*d^2 -> cell edge (d = 250 m): S = 8 ms
                               # with E[T] = 10 ms the load is <= 0.8 everywhere under ideal association,
                               # so any overload we see is caused by the handover procedure, not by alpha
*.vehicle.initialPosition = uniform(0m, 2000m)   # random start, different per replication

# ---- results ----
**.vector-recording = false    # vectors are big: enabled only in the "TimeSeries" config
# one folder per config, file name = iteration variables + repetition (e.g. V=10-H=0.5-T=10-rep3.sca)
output-scalar-file = ${resultdir}/${configname}/${iterationvarsf}rep${repetition}.sca
output-vector-file = ${resultdir}/${configname}/${iterationvarsf}rep${repetition}.vec

#####################################################################
# Common factors for the main campaign (abstract config, not run alone)
#####################################################################
[Config Base]
abstract = true
*.vehicle.speed = ${V=10,20,30,40}mps
*.vehicle.handoverInterval = ${H=0.01,0.02,0.05,0.1,0.2,0.5,1,2,3,5,10,20}s

#####################################################################
# Scenario 1: T ~ Exponential(mean T)            CoV(T) = 1
#####################################################################
[Config Exponential]
extends = Base
description = "T exponential"
*.vehicle.appInterval = exponential(${T=10,15,20}ms)

#####################################################################
# Scenario 2: T ~ Lognormal with the SAME mean T (and, with cv = 1, the same variance)
#   OMNeT++ lognormal(m, w): m, w = mean and std.dev of the underlying normal
#   w^2 = ln(1 + cv^2),   m = ln(E[T]) - w^2/2      ->   E[T] and CoV(T) = cv exactly
#####################################################################
[Config Lognormal]
extends = Base
description = "T lognormal, same mean and variance as exponential"
*.vehicle.appInterval = lognormal(log(${T=10,15,20}e-3) - log(1 + ${cv=1}^2)/2, sqrt(log(1 + ${cv}^2))) * 1s

#####################################################################
# Extra: how much does the VARIABILITY of T matter? (lognormal, same mean, CoV 0.5 ... 3)
#####################################################################
[Config LognormalCV]
description = "lognormal T, mean fixed, CoV increasing"
*.vehicle.speed = 30mps
*.vehicle.handoverInterval = ${H=0.01,0.02,0.05,0.1,0.2,0.5,1,2,3,5,10}s
*.vehicle.appInterval = lognormal(log(10e-3) - log(1 + ${cv=0.5,2,3}^2)/2, sqrt(log(1 + ${cv}^2))) * 1s

#####################################################################
# Benchmark = lower bound: ideal association (always the closest BS) and NO handover packets
#   also used for validation (quasi-static M/D/1, see analyze_results.py)
#####################################################################
[Config IdealHandover]
description = "ideal association, no handover traffic (lower bound)"
*.vehicle.idealHandover = true
*.vehicle.handoverInterval = 1000000s     # no handover packets
*.vehicle.speed = ${V=10,20,30,40}mps
*.vehicle.appInterval = exponential(${T=10,15,20}ms)

#####################################################################
# VERIFICATION 1 : D/D/1  (deterministic T, vehicle not moving)
#   d = 125 m, S = 1.28e-7 * 125^2 = 2 ms, T = 10 ms  ->  no queueing, E2E = 2 ms exactly
#####################################################################
[Config Validation_DD1]
description = "D/D/1 sanity check"
sim-time-limit = 100s
warmup-period = 0s
repeat = 1
*.roadOffset = 0m
*.backhaulDelay = 0s
*.vehicle.speed = 0mps
*.vehicle.initialPosition = 125m
*.vehicle.handoverInterval = 1000000s     # no handover packets
*.vehicle.appInterval = 10ms

#####################################################################
# VERIFICATION 2 : M/D/1  (exponential T, constant S = 2 ms)
#   Pollaczek-Khinchine:  E[R] = S + rho*S / (2(1-rho)),  rho = S / E[T]
#   E[T] = 8, 4, 3, 2.5 ms -> rho = 0.25, 0.5, 0.667, 0.8
#   expected E2E = 2.333, 3.0, 4.0, 6.0 ms
#####################################################################
[Config Validation_MD1]
extends = Validation_DD1
description = "M/D/1 validation against P-K formula"
sim-time-limit = 5000s
warmup-period = 100s
repeat = 10
*.vehicle.appInterval = exponential(${Tv=8,4,3,2.5}ms)

#####################################################################
# Time series (vectors ON): a stable, a borderline and a collapsing H, 3 replicas each
#   (never conclude from a single trajectory); replica 0 of H = 5 s is used for the highway GIF
#####################################################################
[Config TimeSeries]
description = "delay over time for H = 1, 5, 20 s"
sim-time-limit = 600s
warmup-period = 0s
repeat = 3
**.as.endToEndDelay:vector.vector-recording = true
**.vehicle.servingBs:vector.vector-recording = true
*.vehicle.speed = 30mps
*.vehicle.handoverInterval = ${H=1,5,20}s
*.vehicle.appInterval = exponential(10ms)
*.vehicle.initialPosition = 0m
