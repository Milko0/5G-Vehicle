[General]
network = Network_5G
cpu-time-limit = 1h
sim-time-limit = 1h
result-dir = results/${configname}
seed-set = ${repetition}                            # i-th replication of every scenario uses the same seeds

**.L = 10000m                                       # highway length
**.N = 11                                           # number of base stations -> ISD = 1 km
**.backhaulDelay = 0.002s                           # wired links BS <-> servers
**.bs[*].delay = 0.001s                             # radio downlink (handover response -> vehicle)
**.vehicle.radioInterface.BSRoadOffset = 20m        # distance of the BSs from the road
**.vehicle.radioInterface.alpha = 0.00000004        # S = alpha * d^2
**.vehicle.mobilitySystem.speed = 25.0mps
**.vehicle.mobilitySystem.initialPosition = 0m
**.vehicle.mobilitySystem.idealHandover = false
**.vehicle.handoverSystem.H = 0.1s                  # handover packet interval
**.vehicle.application.interArrivalTime = 0.01s

########################
## Verification tests ##
########################

# common settings of the tests (abstract: not run alone)
[Config Test]
abstract = true
result-dir = results/test/${configname}
sim-time-limit = 800s
warmup-period = 0s
repeat = 1

# vehicle modeled as a D/D/1 queue: stationary vehicle at d = 250 m -> S = 2.5 ms, T = 10 ms
[Config Verification_DD1]
extends = Test
description = "Verification of the system with the vehicle behavior modeled as a D/D/1 queueing system"
sim-time-limit = 101s
warmup-period = 1s                                  # no packets at t = 0 s
**.backhaulDelay = 0s
**.vehicle.mobilitySystem.speed = 0mps
**.vehicle.mobilitySystem.initialPosition = 250m
**.vehicle.mobilitySystem.idealHandover = true
**.vehicle.handoverSystem.H = 0s
**.vehicle.radioInterface.BSRoadOffset = 0m

# incremental testing 1: add the motion of the vehicle and the backhaul delay (ideal handover)
[Config Verification_Kinematics]
extends = Test
description = "Verification of the system with kinematics and boundary events with ideal handover"
**.vehicle.mobilitySystem.idealHandover = true
**.vehicle.handoverSystem.H = 0s

# incremental testing 2: add the real handover too (H = 0.1 s from [General])
[Config Verification_Kinematics_Handover]
extends = Test
description = "Verification of the system with kinematics and boundary events with real handover"

# degeneracy test: the whole simulator with alpha = 0
[Config Verification_Degeneracy_Alpha0]
extends = Test
description = "Degeneracy test: alpha = 0"
**.vehicle.radioInterface.alpha = 0
**.vehicle.application.interArrivalTime = exponential(0.01s)

# degeneracy test: one BS only, road of 500 m
[Config Verification_Degeneracy_N1]
extends = Test
description = "Degeneracy test: N = 1, L = 500m"
**.L = 500m
**.N = 1
**.vehicle.application.interArrivalTime = exponential(0.01s)

# consistency test: base case ...
[Config Verification_Consistency_Base]
extends = Test
description = "Consistency test: base case"
**.vehicle.application.interArrivalTime = exponential(0.01s)

# ... and scaled case: double L, offset and speed, alpha / 4
[Config Verification_Consistency_scaled]
extends = Verification_Consistency_Base
description = "Consistency test: scaled case"
**.L = 20000m
**.vehicle.radioInterface.BSRoadOffset = 40m
**.vehicle.mobilitySystem.speed = 50mps
**.vehicle.radioInterface.alpha = 0.00000001

# continuity test: small perturbations of alpha around 4e-8
[Config Verification_Continuity]
extends = Test
description = "Continuity test: small perturbations of alpha"
**.vehicle.radioInterface.alpha = ${alpha = 3.92e-8, 3.96e-8, 4.00e-8, 4.04e-8, 4.08e-8}
**.vehicle.application.interArrivalTime = exponential(0.01s)

########################
##  Validation tests  ##
########################

# M/D/1 queue: same set-up as the D/D/1 test (S = 2.5 ms), but exponential T
[Config Validation_MD1]
extends = Verification_DD1
description = "Validation of the system against M/D/1 queueing system"
sim-time-limit = 110s
warmup-period = 10s
repeat = 30                                         # 30 replications -> normal approximation for the CIs
**.vector-recording = false
# rho = 0.25, 0.50, 0.67, 0.80
**.vehicle.application.interArrivalTime = exponential(${mean = 0.01, 0.005, 0.00375, 0.003125}s)

########################
##    Calibration     ##
########################

# warm-up estimation via independent replications, heavy lognormal load (E[T] = 7.5 ms, CoV = 2)
[Config Calibration_Warmup]
result-dir = results/calibration/${configname}
description = "Warm-up calibration: heavy Lognormal load"
sim-time-limit = 800s
warmup-period = 0s
repeat = 20
**.applicationServer.*.vector-recording = true      # record only the endToEndDelay vector
**.vector-recording = false
**.vehicle.application.interArrivalTime = 1s * lognormal(log(0.0075) - log(1 + 2^2)/2, sqrt(log(1 + 2^2)))

########################
##    Experiments     ##
########################
# Lognormal with the same mean E[T] as the exponential and CoV = 2:
#   OMNeT++ lognormal(m, w): m, w = mean and std.dev of the underlying normal
#   w^2 = ln(1 + CoV^2),  m = ln(E[T]) - w^2/2

# common settings of the experiments (abstract)
[Config Experiment]
abstract = true
result-dir = results/experiments/${configname}
sim-time-limit = 2480s
warmup-period = 80s
repeat = 30
**.vector-recording = false
# random start position, different in every replication (same in every scenario, seed-set = ${repetition}):
# with x = 0 for every run, the handover packets fell exactly on the cell crossings for many (V, H) pairs
**.vehicle.mobilitySystem.initialPosition = uniform(0m, 10000m)

# factors H and V
[Config Experiment_Base]
abstract = true
extends = Experiment
**.vehicle.handoverSystem.H = ${H = 0.02, 0.1, 1, 5}s
**.vehicle.mobilitySystem.speed = ${V = 15, 25, 40}mps

# Scenario 1: exponential inter-arrival times (CoV = 1)
[Config Exp_Exponential]
extends = Experiment_Base
description = "Full factorial experiment: Exponential traffic (CoV = 1)"
**.vehicle.application.interArrivalTime = exponential(${meanT = 0.015, 0.01, 0.0075}s)

# Scenario 2: lognormal inter-arrival times (same mean E[T], CoV = 2)
[Config Exp_Lognormal]
extends = Experiment_Base
description = "Full factorial experiment: Lognormal traffic (CoV = 2)"
**.vehicle.application.interArrivalTime = 1s * lognormal(log(${meanT = 0.015, 0.01, 0.0075}) - log(1 + 2^2)/2, sqrt(log(1 + 2^2)))

#######################################
##  Ideal Handover Lower-Bound Runs  ##
#######################################
[Config Experiment_Ideal_Base]
abstract = true
extends = Experiment
**.vehicle.mobilitySystem.idealHandover = true
**.vehicle.handoverSystem.H = 0s
**.vehicle.mobilitySystem.speed = ${V = 15, 25, 40}mps

[Config Exp_Ideal_Exponential]
extends = Experiment_Ideal_Base
description = "Ideal handover lower bound: Exponential traffic (CoV = 1)"
**.vehicle.application.interArrivalTime = exponential(${meanT = 0.015, 0.01, 0.0075}s)

[Config Exp_Ideal_Lognormal]
extends = Experiment_Ideal_Base
description = "Ideal handover lower bound: Lognormal traffic (CoV = 2)"
**.vehicle.application.interArrivalTime = 1s * lognormal(log(${meanT = 0.015, 0.01, 0.0075}) - log(1 + 2^2)/2, sqrt(log(1 + 2^2)))

##############################
##   Vector Runs for ECDFs  ##
##############################
[Config Experiment_ECDF_Base]
abstract = true
extends = Experiment
sim-time-limit = 880s
repeat = 5
**.applicationServer.*.vector-recording = true      # record only the endToEndDelay vector
**.vehicle.mobilitySystem.speed = 25mps
**.vehicle.handoverSystem.H = ${H = 0.02, 0.1, 1, 5}s

[Config Exp_ECDF_Exponential]
extends = Experiment_ECDF_Base
description = "ECDF delay vectors at V=25 m/s, E[T]=10 ms (Exponential)"
**.vehicle.application.interArrivalTime = exponential(0.01s)

[Config Exp_ECDF_Lognormal]
extends = Experiment_ECDF_Base
description = "ECDF delay vectors at V=25 m/s, E[T]=10 ms (Lognormal, CoV=2)"
**.vehicle.application.interArrivalTime = 1s * lognormal(log(0.01) - log(1 + 2^2)/2, sqrt(log(1 + 2^2)))

##############################
##   Run for the animation  ##
##############################
# one run with the serving BS and the delay over time (read by Analysis/make_highway_gif.py)
[Config Animation]
result-dir = results/experiments/${configname}
description = "Highway animation: V = 25 m/s, H = 5 s, E[T] = 10 ms (Exponential)"
sim-time-limit = 500s
warmup-period = 0s
repeat = 1
**.applicationServer.endToEndDelay:vector.vector-recording = true
**.vehicle.mobilitySystem.servingBS:vector.vector-recording = true
**.vector-recording = false
**.vehicle.mobilitySystem.speed = 25mps
**.vehicle.handoverSystem.H = 5s
**.vehicle.application.interArrivalTime = exponential(0.01s)
