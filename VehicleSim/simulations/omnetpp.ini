[General]
network = Network_5G
cpu-time-limit = 1h
sim-time-limit = 1h
result-dir = results/${configname}
**.L = 10000m #highway length
**.N = 11 #number of base stations
**.backhaulDelay = 0.002s #backhaul delay between base stations
**.vehicle.radioInterface.BSRoadOffset = 20m #distance from the road to the base station
**.vehicle.radioInterface.alpha = 0.00000004 #proportionality constant for the propagation model
**.vehicle.mobilitySystem.speed = 25.0mps #default value for the vehicle speed
**.vehicle.mobilitySystem.initialPosition = 0m #default value for the vehicle initial position
**.vehicle.handoverSystem.H = 0.1s #handover packets interval
**.bs[*].delay = 0.001s #delay for sending handover response to the vehicle
**.vehicle.application.interArrivalTime = 0.01s #inter-arrival time for application packets
**.vehicle.mobilitySystem.idealHandover = false #whether to use ideal handover or not
#debug-on-errors = true

########################
## Verification tests ##
########################

# Verification of the system with the vehicle behavior modeled as a D/D/1 queueing system
[Config Verification_DD1]
result-dir = results/test/${configname}
description = "Verification of the system with the vehicle behavior modeled as a D/D/1 queueing system"
sim-time-limit = 101s
# No packets at t=0s -> warmup-period = 1s
warmup-period = 1s
repeat = 1
# Stationary vehicle with distance d = 250m -> S = 2.5ms
**.backhaulDelay = 0s
**.vehicle.mobilitySystem.speed = 0mps
**.vehicle.mobilitySystem.initialPosition = 250m
**.vehicle.mobilitySystem.idealHandover = true
**.vehicle.handoverSystem.H = 0s
**.vehicle.radioInterface.BSRoadOffset = 0m
# Deterministic Traffic
**.vehicle.application.interArrivalTime = 0.01s

# Now we add some of the functions back to the system for incremental testing
[Config Verification_Kinematics]
result-dir = results/test/${configname}
description = "Verification of the system with kinematics and boundary events with ideal handover"
sim-time-limit = 800s
warmup-period = 0s
repeat = 1

# add back the backhaul delay and motion of the vehicle (general config)
**.vehicle.mobilitySystem.idealHandover = true
**.vehicle.handoverSystem.H = 0s
**.vehicle.application.interArrivalTime = 0.01s

# Add the real Handoff too
[Config Verification_Kinematics_Handover]
result-dir = results/test/${configname}
description = "Verification of the system with kinematics and boundary events with real handover"
sim-time-limit = 800s
warmup-period = 0s
repeat = 1

# add the handover system with H = 0.1s
**.vehicle.handoverSystem.H = 0.1s
**.vehicle.application.interArrivalTime = 0.01s

# Degeneracy Test: we use the entire simulator but with alpha set to 0
[Config Verification_Degeneracy_Alpha0]
result-dir = results/test/${configname}
description = "Degeneracy test: alpha = 0"
sim-time-limit = 800s
warmup-period = 0s
repeat = 1

# add the handover system with H = 0.1s and alpha = 0
**.vehicle.handoverSystem.H = 0.1s
**.vehicle.radioInterface.alpha = 0
**.vehicle.application.interArrivalTime = exponential(0.01s)

# Degeneracy Test: we use the entire simulator but the number of BS is 1 and L 500m
[Config Verification_Degeneracy_N1]
result-dir = results/test/${configname}
description = "Degeneracy test: N = 1, L = 500m"
sim-time-limit = 800s
warmup-period = 0s
repeat = 1

# Set road length and number of BS
**.L = 500m
**.N = 1
**.vehicle.application.interArrivalTime = exponential(0.01s)

# Consistency test: base case 
[Config Verification_Consistency_Base]
result-dir = results/test/${configname}
description = "Consistency test: base case"
sim-time-limit = 800s
warmup-period = 0s
repeat = 1
seed-set = ${repetition}
**.vehicle.application.interArrivalTime = exponential(0.01s)

# Consistency test: double offset, L and speed, alpha = 0.00000001
[Config Verification_Consistency_scaled]
result-dir = results/test/${configname}
description = "Consistency test: scaled case"
extends = Verification_Consistency_Base
**.L = 20000m
**.vehicle.radioInterface.BSRoadOffset = 40m
**.vehicle.mobilitySystem.speed = 50mps
**.vehicle.radioInterface.alpha = 0.00000001

# Continuity Test: small perturbations of alpha around 4e-8
[Config Verification_Continuity]
result-dir = results/test/${configname}
description = "Continuity test: small perturbations of alpha"
sim-time-limit = 800s
warmup-period = 0s
repeat = 1
seed-set = ${repetition}
**.vehicle.radioInterface.alpha = ${alpha = 3.92e-8, 3.96e-8, 4.00e-8, 4.04e-8, 4.08e-8}
**.vehicle.application.interArrivalTime = exponential(0.01s)

########################
##  Validation tests  ##
########################

# Analytical validation against M/D/1 queueing system
[Config Validation_MD1]
result-dir = results/test/${configname}
description = "Validation of the system against M/D/1 queueing system"
sim-time-limit = 110s
warmup-period = 10s
# We use 30 repeat to use normal distribution
repeat = 30
**.vector-recording = false

# Stationary vehicle at posotion 250 -> fixed service time = 2.5ms
**.backhaulDelay = 0s
**.vehicle.mobilitySystem.speed = 0mps
**.vehicle.mobilitySystem.initialPosition = 250m
**.vehicle.mobilitySystem.idealHandover = true
**.vehicle.handoverSystem.H = 0s
**.vehicle.radioInterface.BSRoadOffset = 0m

# rho = 0.5, 0.50, 0.67, 0.80
**.vehicle.application.interArrivalTime = exponential(${mean = 0.01, 0.005, 0.00375, 0.003125}s)
seed-set = ${repetition}


########################
##    Calibration     ##
########################

# Warm-up estimation via independent replications
[Config Calibration_Warmup]
result-dir = results/calibration/${configname}
description = "Warm-up calibration: heavy Lognormal load"
sim-time-limit = 800s
warmup-period = 0s
repeat = 20
seed-set = ${repetition}
# Record only endToEndDelay vector to keep files small and fast
**.applicationServer.*.vector-recording = true
**.vector-recording = false
# Use a heavy load with lognormal inter-arrival times
**.vehicle.application.interArrivalTime = 1s * lognormal(log(0.0075) - 0.8047189562, 1.2686362412)


########################
##    Experiments     ##
########################
[Config Experiment_Base]
abstract = true
result-dir = results/experiments/${configname}
sim-time-limit = 2480s
warmup-period = 80s
repeat = 30
seed-set = ${repetition}
**.vector-recording = false
**.vehicle.handoverSystem.H = ${H = 0.02, 0.1, 1, 5}s
**.vehicle.mobilitySystem.speed = ${V = 15, 25, 40}mps

# Scenario 1: Exponential inter-arrival times (CoV = 1)
[Config Exp_Exponential]
extends = Experiment_Base
description = "Full factorial experiment: Exponential traffic (CoV = 1)"
**.vehicle.application.interArrivalTime = exponential(${meanT = 0.015, 0.01, 0.0075}s)
# Scenario 2: Lognormal inter-arrival times (same mean E[T], CoV = 2)
[Config Exp_Lognormal]
extends = Experiment_Base
description = "Full factorial experiment: Lognormal traffic (CoV = 2)"
**.vehicle.application.interArrivalTime = 1s * lognormal(log(${meanT = 0.015, 0.01, 0.0075}) - 0.8047189562, 1.2686362412)

#######################################
##  Ideal Handover Lower-Bound Runs  ##
#######################################
[Config Experiment_Ideal_Base]
abstract = true
result-dir = results/experiments/${configname}
sim-time-limit = 2480s
warmup-period = 80s
repeat = 30
seed-set = ${repetition}
**.vector-recording = false
**.vehicle.mobilitySystem.idealHandover = true
**.vehicle.handoverSystem.H = 0s
**.vehicle.mobilitySystem.speed = ${V = 15, 25, 40}mps
[Config Exp_Ideal_Exponential]
extends = Experiment_Ideal_Base
description = "Ideal handover lower bound: Exponential traffic (CoV = 1)"
**.vehicle.application.interArrivalTime = exponential(${meanT = 0.015, 0.01, 0.0075}s)
[Config Exp_Ideal_Lognormal]
extends = Experiment_Ideal_Base
description = "Ideal handover lower bound: Lognormal traffic (CoV = 2)"
**.vehicle.application.interArrivalTime = 1s * lognormal(log(${meanT = 0.015, 0.01, 0.0075}) - 0.8047189562, 1.2686362412)


##############################
##   Vector Runs for ECDFs  ##
##############################
[Config Experiment_ECDF_Base]
abstract = true
result-dir = results/experiments/${configname}
sim-time-limit = 880s
warmup-period = 80s
repeat = 5
seed-set = ${repetition}
# Record ONLY endToEndDelay vector
**.applicationServer.*.vector-recording = true
**.vector-recording = false
**.vehicle.mobilitySystem.speed = 25mps
**.vehicle.handoverSystem.H = ${H = 0.02, 0.1, 1, 5}s
[Config Exp_ECDF_Exponential]
extends = Experiment_ECDF_Base
description = "ECDF delay vectors at V=25 m/s, E[T]=10 ms (Exponential)"
**.vehicle.application.interArrivalTime = exponential(0.01s)
[Config Exp_ECDF_Lognormal]
extends = Experiment_ECDF_Base
description = "ECDF delay vectors at V=25 m/s, E[T]=10 ms (Lognormal, CoV=2)"
**.vehicle.application.interArrivalTime = 1s * lognormal(log(0.01) - 0.8047189562, 1.2686362412)